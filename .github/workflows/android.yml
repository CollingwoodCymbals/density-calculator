name: Build Android app

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build unsigned app bundle
        run: gradle -p android :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
      - name: Save the bundle to the android-build branch
        run: |
          mkdir /tmp/out && cp android/app/build/outputs/bundle/release/*.aab /tmp/out/app-release-unsigned.aab
          cd /tmp/out && git init -q -b android-build
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "Unsigned bundle from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-build
