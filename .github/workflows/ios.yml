name: Build iPhone app

# On every push to the app or iPhone files this checks the iPhone app still builds.
# Run it by hand ("Run workflow") to sign it and send a build to App Store Connect / TestFlight.
# Needs one repo secret: ASC_KEY_P8 (the full text of the "Density app upload" App Store Connect API key, .p8 file).

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "privacy.html"
      - "ios-app/**"
      - ".github/workflows/ios.yml"

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare the iPhone project
        working-directory: ios-app
        run: |
          npm ci
          npm run copy-web
          npx cap sync ios
      - name: Check it builds (no signing)
        if: github.event_name != 'workflow_dispatch'
        working-directory: ios-app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
      - name: Sign and upload to App Store Connect
        if: github.event_name == 'workflow_dispatch'
        working-directory: ios-app/ios/App
        env:
          TEAM: W5TF4B5MYQ
          KEY_ID: Y2R5S64KPM
          ISSUER: 92c278e5-9642-4ec0-9a9e-6b734c0b4006
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${AUTH[@]}" archive | tail -n 40
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM" ExportOptions.plist
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY"
